<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WordSquad is waking up</title>
  <!-- CloudFront serves this page in place of any game URL while the server is
       asleep, so everything is inline (relative asset paths would break). -->
  <style>
    :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5d6677; --tile: #6aaa64; --tile2: #c9b458; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121417; --fg: #e8eaef; --muted: #9aa3b2; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 26rem; }
    .tiles { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
    .tiles span { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 6px;
                  font-weight: 800; font-size: 22px; color: #fff; background: var(--tile);
                  animation: pop 1.4s ease-in-out infinite; }
    .tiles span:nth-child(even) { background: var(--tile2); }
    .tiles span:nth-child(2) { animation-delay: .1s; } .tiles span:nth-child(3) { animation-delay: .2s; }
    .tiles span:nth-child(4) { animation-delay: .3s; } .tiles span:nth-child(5) { animation-delay: .4s; }
    @keyframes pop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .tiles span { animation: none; } }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); }
    button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
             background: var(--tile); color: #fff; font-weight: 600; }
    .eta { margin: 4px 0 10px; }
    .eta strong { display: block; font-size: 2rem; line-height: 1.1; color: var(--tile);
                  font-variant-numeric: tabular-nums; }
    .eta span { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .bar { height: 10px; max-width: 18rem; margin: 0 auto 16px; border-radius: 999px; overflow: hidden;
           background: color-mix(in srgb, var(--muted) 25%, transparent); }
    .bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--tile);
                transition: width 1s linear; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="tiles" aria-hidden="true"><span>W</span><span>A</span><span>K</span><span>E</span><span>!</span></div>
    <h1 id="title">Waking up the game server…</h1>
    <p id="status" role="status" aria-live="polite">It naps when nobody's playing. This usually takes about a minute.</p>
    <div id="estimate">
      <p class="eta"><strong id="eta">~1:00</strong><span id="etaLabel">usual wait</span></p>
      <div class="bar" id="bar" role="progressbar" aria-label="Server start-up" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="barFill"></span></div>
    </div>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    (function () {
      var title = document.getElementById('title');
      var status = document.getElementById('status');
      var retry = document.getElementById('retry');
      var estimate = document.getElementById('estimate');
      var eta = document.getElementById('eta');
      var etaLabel = document.getElementById('etaLabel');
      var bar = document.getElementById('bar');
      var barFill = document.getElementById('barFill');
      var started = Date.now();
      var lastWake = started;
      // /wake only starts a stopped server. If it was still shutting down
      // ("running" or "stopping"), ask again after 5 s rather than 30 s.
      var wakeEvery = 30 * 1000;
      var timer = null;
      var ticker = null;

      // Live estimate: an inline copy of static/js/wakeEstimate.js (this page
      // can't load modules). /wake says how long ago the boot began; the usual
      // boot length learns from wakes this browser has seen.
      var HISTORY_KEY = 'wakeDurations';
      var SHUTDOWN_SECONDS = 30;
      var serverState = null;
      var bootStartedAt = null;
      var bootStartKnown = false;
      var stoppingSince = null;

      function plausible(n) { return typeof n === 'number' && isFinite(n) && n >= 10 && n <= 300; }
      function history() {
        try {
          var saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter(plausible) : [];
        } catch (e) { return []; }
      }
      function typicalSeconds() {
        var h = history().sort(function (a, b) { return a - b; });
        if (!h.length) return 60;
        var mid = h.length >> 1;
        return Math.round(h.length % 2 ? h[mid] : (h[mid - 1] + h[mid]) / 2);
      }
      function remember(seconds) {
        if (!plausible(seconds)) return;
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(history().concat([Math.round(seconds)]).slice(-5)));
        } catch (e) { /* Storage blocked. */ }
      }
      var typical = typicalSeconds();
      function clock(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }

      function render() {
        var now = Date.now();
        var remaining = null;
        var progress = 0;
        var label = 'estimated wait';
        if (serverState === 'stopping') {
          var stoppingFor = stoppingSince === null ? 0 : (now - stoppingSince) / 1000;
          remaining = Math.max(typical, Math.ceil(typical + SHUTDOWN_SECONDS - stoppingFor));
          progress = 0.04;
        } else if (bootStartedAt !== null) {
          var elapsed = (now - bootStartedAt) / 1000;
          remaining = Math.max(0, Math.ceil(typical - elapsed));
          progress = elapsed <= typical ? 0.9 * Math.max(0, elapsed) / typical
            : 0.9 + 0.09 * (1 - Math.exp(-(elapsed - typical) / typical));
          if (elapsed > typical) label = elapsed > typical + 30 ? 'taking a little longer than usual' : 'just finishing up';
        }
        if (remaining === null) { eta.textContent = '~' + clock(typical); etaLabel.textContent = 'usual wait'; }
        else if (remaining === 0) { eta.textContent = 'Any second'; etaLabel.textContent = label; }
        else { eta.textContent = clock(remaining); etaLabel.textContent = label; }
        var percent = Math.round(progress * 100);
        barFill.style.width = percent + '%';
        bar.setAttribute('aria-valuenow', String(percent));
      }

      function tick() {
        render();
        ticker = setTimeout(tick, 1000);
      }

      function wake() {
        lastWake = Date.now();
        return fetch('/wake', { cache: 'no-store' }).then(function (r) {
          if (r.status === 423) {
            title.textContent = 'WordSquad is taking a short break';
            status.textContent = 'The game is paused for now. Please check back later.';
            estimate.hidden = true;
            clearTimeout(ticker);
            throw new Error('paused');
          }
          return r.json().catch(function () { return {}; });
        }).then(function (data) {
          var state = data && data.state;
          wakeEvery = state === 'pending' ? 30 * 1000 : 5 * 1000;
          serverState = state || null;
          if (state === 'pending' || state === 'running') {
            if (typeof data.elapsed === 'number' && isFinite(data.elapsed)) {
              bootStartedAt = Date.now() - data.elapsed * 1000;
              bootStartKnown = true;
            } else if (bootStartedAt === null) {
              bootStartedAt = Date.now();
              bootStartKnown = state === 'pending';
            }
            stoppingSince = null;
          } else if (state === 'stopping' && stoppingSince === null) {
            stoppingSince = Date.now();
          }
          render();
        });
      }

      function check() {
        fetch('/health', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (data && data.status === 'ok') {
              if (bootStartKnown) remember((Date.now() - bootStartedAt) / 1000);
              clearTimeout(ticker);
              window.location.reload();
              return;
            }
            if (Date.now() - started > 4 * 60 * 1000) { giveUp(); return; }
            // Re-send the wake request now and then in case the server was
            // still finishing a shutdown the first time.
            if (Date.now() - lastWake > wakeEvery) { wake().catch(function () {}); }
            timer = setTimeout(check, 4000);
          })
          .catch(function () { timer = setTimeout(check, 4000); });
      }

      function giveUp() {
        status.textContent = 'This is taking longer than usual.';
        estimate.hidden = true;
        clearTimeout(ticker);
        retry.hidden = false;
      }

      retry.addEventListener('click', function () {
        retry.hidden = true;
        estimate.hidden = false;
        status.textContent = 'Trying again…';
        started = Date.now();
        clearTimeout(timer);
        clearTimeout(ticker);
        tick();
        wake().then(check).catch(function () {});
      });

      tick();
      wake().then(check).catch(function (err) { if (err.message !== 'paused') check(); });
    })();
  </script>
</body>
</html>
